[project]
name = "ai-discord-architect"
description = "Discord bot driven by an AI agent — natural language to validated action plans."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
version = "0.1.0"
dependencies = [
    "discord.py>=2.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.28",
    "openai>=1.30",
]

[project.scripts]
architect = "architect.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/architect"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "PL",            # pylint
    "PT",            # pytest-style
    "TID",           # tidy imports
    "C4",            # comprehensions
    "ARG",           # unused args
]
ignore = [
    "PLR0913",       # too many arguments — Discord APIs naturally have many params
    "PLR2004",       # magic value comparison — common in tests
    "E501",          # line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",      # unused arguments — test fixtures often have unused params
    "PLR0915",  # too many statements — test setups can be long
    "PLC0415",  # imports inside tests are fine for isolation
    "E402",     # module-level import order in tests is permissive
    "RUF059",   # unpacked-but-unused — common in tests destructuring tuples
    "PT018",    # composite assertions are clearer in some tests
    "B008",     # function call in default arg is fine in fixtures
]
"src/architect/agent/tools.py" = ["RUF003"]
"src/architect/executor/executor.py" = ["SIM102"]
"src/architect/executor/handlers/server.py" = ["PLR0912"]
"src/architect/bot/events.py" = ["PLR0912", "PLR0915", "RUF003", "PLC0415", "B008", "PLW2901", "SIM105"]
"src/architect/bot/views.py" = ["ARG002", "B008", "PLC0415"]  # discord.ui signatures and Color defaults
"src/architect/bot/bot.py" = ["ARG002"]  # discord overrides args/kwargs we don't use
"src/architect/agent/agent.py" = ["RUF003", "PLC0415", "PLR0912"]  # lazy provider imports are intentional

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = false
exclude = ["tests/", "build/", ".venv/"]

# Modules being refactored in later phases — mypy strictness will be tightened
# as the refactor lands. Tracked: executor.py (Phase 4), tools.py (Phase 5),
# bot/events.py (Phase 4), providers (Phase 4).
[[tool.mypy.overrides]]
# Modules with heavy discord.py SDK interaction. The SDK's own type stubs are
# loose enough that strict mypy raises many false-positives on attribute
# narrowing; we relax the worst offenders here rather than scatter
# # type: ignore[attr-defined] across dozens of call sites. The tools.py
# module remains until Phase 5 rewrites it from Pydantic schemas.
module = [
    "architect.agent.providers.*",
    "architect.bot.events",
    "architect.bot.bot",
    "architect.agent.agent",
    "architect.executor.handlers.*",
]
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false
disable_error_code = [
    "union-attr",
    "arg-type",
    "dict-item",
    "type-arg",
    "no-untyped-def",
    "assignment",
    "attr-defined",
    "no-any-return",
    "var-annotated",
    "return-value",
]

[[tool.mypy.overrides]]
module = ["discord.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
source = ["src/architect"]
branch = true
omit = [
    "src/architect/main.py",
    "src/architect/__init__.py",
    "src/architect/logging_setup.py",
    # bot.py is the thin discord.py setup wiring (intents, cog registration,
    # tree.sync). It has no business logic worth unit-testing — exercising
    # it requires a real Discord gateway connection. Smoke-tested manually.
    "src/architect/bot/bot.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"
